<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>우단앱 관리자</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,'Noto Sans KR',sans-serif;background:#111;color:#eee;min-height:100vh;}
.topbar{background:#A51C30;padding:16px 20px;display:flex;align-items:center;gap:12px;}
.topbar h1{font-size:18px;font-weight:700;color:white;}
.tabs{display:flex;background:#1a1a1a;border-bottom:1px solid #333;overflow-x:auto;}
.tab{padding:14px 20px;font-size:13px;font-weight:600;color:#888;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;}
.tab.active{color:#A51C30;border-bottom-color:#A51C30;}
.content{padding:16px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px;}
.stat-card{background:#1a1a1a;border-radius:12px;padding:16px;text-align:center;}
.stat-num{font-size:28px;font-weight:800;color:#A51C30;}
.stat-lbl{font-size:11px;color:#888;margin-top:4px;}
.filter-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.filter-btn{border:1.5px solid #333;border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;background:#1a1a1a;color:#aaa;}
.filter-btn.active{border-color:#A51C30;color:#A51C30;background:#2a0a0f;}
.card{background:#1a1a1a;border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid #2a2a2a;}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.card-title{font-size:14px;font-weight:600;color:#eee;}
.card-danji{font-size:11px;color:#A51C30;font-weight:600;margin-bottom:4px;}
.card-meta{font-size:11px;color:#666;}
.card-price{font-size:16px;font-weight:700;color:#eee;margin-top:6px;}
.badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;}
.badge-sale{background:#2a0a0f;color:#A51C30;}
.badge-done{background:#222;color:#666;}
.del-btn{background:#FF4757;color:white;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;}
.loading{text-align:center;padding:40px;color:#666;}
.danji-tag{font-size:10px;background:#222;color:#aaa;padding:2px 8px;border-radius:10px;margin-left:6px;}
#pwScreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;}
#adminContent{display:none;}
.empty{text-align:center;padding:40px;color:#555;font-size:14px;}
</style>
</head>
<body>

<div id="pwScreen">
  <h2 style="font-size:22px;font-weight:800;color:#A51C30;margin-bottom:28px;">🏠 우단앱 관리자</h2>
  <input type="password" id="pwInput" maxlength="4" inputmode="numeric" placeholder="0000"
    style="border:1.5px solid #333;border-radius:10px;padding:16px 20px;font-size:28px;text-align:center;background:#1a1a1a;color:#eee;outline:none;width:160px;letter-spacing:10px;"
    onkeydown="if(event.key==='Enter')checkPw()">
  <button onclick="checkPw()"
    style="margin-top:16px;background:#A51C30;color:white;border:none;border-radius:10px;padding:14px 48px;font-size:16px;font-weight:700;cursor:pointer;">
    입력
  </button>
  <p id="pwError" style="color:#FF4757;font-size:13px;margin-top:14px;display:none;">비번이 틀렸어요</p>
</div>

<div id="adminContent">
  <div class="topbar">
    <h1>🏠 우단앱 관리자</h1>
  </div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('items')">거래</div>
    <div class="tab" onclick="switchTab('talents')">재능마켓</div>
    <div class="tab" onclick="switchTab('helps')">도움요청</div>
    <div class="tab" onclick="switchTab('lost')">분실물</div>
    <div class="tab" onclick="switchTab('together')">공동주문</div>
    <div class="tab" onclick="switchTab('lend')">빌려드려요</div>
    <div class="tab" onclick="switchTab('users')">회원</div>
  </div>
  <div class="content">
    <div class="stats">
      <div class="stat-card"><div class="stat-num" id="stat-items">-</div><div class="stat-lbl">거래글</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-users">-</div><div class="stat-lbl">회원수</div></div>
      <div class="stat-card"><div class="stat-num" id="stat-danji">-</div><div class="stat-lbl">단지수</div></div>
    </div>
    <div class="filter-row" id="filterRow"></div>
    <div id="listArea"><div class="loading">로딩중...</div></div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, collection, getDocs, deleteDoc, doc, orderBy, query } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const ADMIN_PW = '1234';

const firebaseConfig = {
  apiKey: "AIzaSyBZwxLXSTjkZkOJt7nKkcxd5j8gulKF5Yk",
  authDomain: "woodan-639a0.firebaseapp.com",
  projectId: "woodan-639a0",
  storageBucket: "woodan-639a0.firebasestorage.app",
  messagingSenderId: "623126216456",
  appId: "1:623126216456:web:386038868d19c5343bf6bd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentTab = 'items';
let allData = [];
let currentFilter = '';

window.checkPw = function() {
  const input = document.getElementById('pwInput').value.trim();
  if (input === ADMIN_PW) {
    document.getElementById('pwScreen').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
    loadStats();
    loadTab('items');
  } else {
    document.getElementById('pwError').style.display = 'block';
  }
};

async function loadStats() {
  const [itemsSnap, usersSnap] = await Promise.all([
    getDocs(collection(db, 'items')),
    getDocs(collection(db, 'users'))
  ]);
  document.getElementById('stat-items').textContent = itemsSnap.size;
  document.getElementById('stat-users').textContent = usersSnap.size;
  const danjiSet = new Set();
  usersSnap.forEach(d => { if(d.data().danjiKey) danjiSet.add(d.data().danjiKey); });
  document.getElementById('stat-danji').textContent = danjiSet.size;
}

window.switchTab = function(tab) {
  currentTab = tab;
  currentFilter = '';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  loadTab(tab);
};

async function loadTab(tab) {
  document.getElementById('listArea').innerHTML = '<div class="loading">로딩중...</div>';
  document.getElementById('filterRow').innerHTML = '';
  try {
    const snap = await getDocs(query(collection(db, tab), orderBy('createdAt', 'desc')));
    allData = [];
    snap.forEach(d => allData.push({ id: d.id, ...d.data() }));
    const danjiSet = new Set(allData.map(d => d.danji).filter(Boolean));
    const filterRow = document.getElementById('filterRow');
    filterRow.innerHTML = `<button class="filter-btn active" onclick="applyFilter('')">전체 (${allData.length})</button>`;
    danjiSet.forEach(danji => {
      const count = allData.filter(d => d.danji === danji).length;
      filterRow.innerHTML += `<button class="filter-btn" onclick="applyFilter('${danji}')">${danji.substring(0,10)} (${count})</button>`;
    });
    renderList(allData, tab);
  } catch(e) {
    document.getElementById('listArea').innerHTML = `<div class="empty">오류: ${e.message}</div>`;
  }
}

window.applyFilter = function(danji) {
  currentFilter = danji;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const filtered = danji ? allData.filter(d => d.danji === danji) : allData;
  renderList(filtered, currentTab);
};

function timeAgo(ts) {
  if (!ts) return '';
  const date = ts.toDate ? ts.toDate() : new Date(ts);
  const s = Math.floor((Date.now() - date) / 1000);
  if (s < 60) return '방금';
  if (s < 3600) return Math.floor(s/60) + '분 전';
  if (s < 86400) return Math.floor(s/3600) + '시간 전';
  return Math.floor(s/86400) + '일 전';
}

function renderList(data, tab) {
  if (!data.length) { document.getElementById('listArea').innerHTML = '<div class="empty">데이터 없음</div>'; return; }
  let html = '';
  data.forEach(it => {
    if (tab === 'items') {
      html += `<div class="card"><div class="card-danji">${it.danji||''} <span class="danji-tag">${it.nick||''}</span></div><div class="card-header"><div><div class="card-title">${it.title||''}</div><div class="card-meta">${timeAgo(it.createdAt)}</div></div><button class="del-btn" onclick="deleteItem('${it.id}','${tab}')">삭제</button></div><div class="card-price">${it.isFree?'나눔':(it.price||0).toLocaleString()+'원'}</div><div style="margin-top:6px;"><span class="badge ${it.status==='sale'?'badge-sale':'badge-done'}">${it.status==='sale'?'판매중':'거래완료'}</span></div></div>`;
    } else if (tab === 'users') {
      html += `<div class="card"><div class="card-danji">${it.danji||'단지없음'}</div><div class="card-header"><div><div class="card-title">${it.nick||''}</div><div class="card-meta">${it.sido||''} ${it.sigungu||''} · 가입 ${timeAgo(it.createdAt)}</div></div></div></div>`;
    } else if (tab === 'talents') {
      html += `<div class="card"><div class="card-danji">${it.danji||''} <span class="danji-tag">${it.nick||''}</span></div><div class="card-header"><div><div class="card-title">${it.title||''}</div><div class="card-meta">${it.cat||''} · ${timeAgo(it.createdAt)}</div></div><button class="del-btn" onclick="deleteItem('${it.id}','${tab}')">삭제</button></div></div>`;
    } else if (tab === 'helps') {
      html += `<div class="card"><div class="card-danji">${it.danji||''} <span class="danji-tag">${it.nick||''}</span></div><div class="card-header"><div><div class="card-title">${it.title||''}</div><div class="card-meta">${it.cat||''} · ${it.reward||'보수협의'} · ${timeAgo(it.createdAt)}</div></div><button class="del-btn" onclick="deleteItem('${it.id}','${tab}')">삭제</button></div></div>`;
    } else if (tab === 'lost') {
      html += `<div class="card"><div class="card-danji">${it.danji||''} <span class="danji-tag">${it.nick||''}</span></div><div class="card-header"><div><div class="card-title">${it.title||''}</div><div class="card-meta">${it.where||''} · ${timeAgo(it.createdAt)}</div></div><button class="del-btn" onclick="deleteItem('${it.id}','${tab}')">삭제</button></div></div>`;
    } else if (tab === 'together') {
      html += `<div class="card"><div class="card-danji">${it.danji||''} <span class="danji-tag">${it.nick||''}</span></div><div class="card-header"><div><div class="card-title">${it.store||''} · ${it.menu||''}</div><div class="card-meta">${it.price||''} · 마감 ${it.deadline||''} · ${timeAgo(it.createdAt)}</div></div><button class="del-btn" onclick="deleteItem('${it.id}','${tab}')">삭제</button></div></div>`;
    } else if (tab === 'lend') {
      const typeLabel = it.type==='want'?'🙏 빌려주세요':it.type==='exchange'?'🔄 교환해요':'🔑 빌려드려요';
      html += `<div class="card"><div class="card-danji">${it.danji||''} <span class="danji-tag">${it.nick||''}</span></div><div class="card-header"><div><div class="card-title">${it.title||''}</div><div class="card-meta">${typeLabel} · ${it.cat||''} · ${timeAgo(it.createdAt)}</div></div><button class="del-btn" onclick="deleteItem('${it.id}','${tab}')">삭제</button></div></div>`;
    }
  });
  document.getElementById('listArea').innerHTML = html;
}

window.deleteItem = async function(id, tab) {
  if (!confirm('삭제할까요?')) return;
  try {
    await deleteDoc(doc(db, tab, id));
    allData = allData.filter(d => d.id !== id);
    const filtered = currentFilter ? allData.filter(d => d.danji === currentFilter) : allData;
    renderList(filtered, tab);
    loadStats();
  } catch(e) { alert('삭제 실패: ' + e.message); }
};
</script>
</body>
</html>
